<!doctype html><html><head>
<!-- The engine addresses its recorded audio relatively (`./audio/music/…`),
     which resolves correctly from the game's index.html at the site root. This
     probe lives two directories down, so without a base the composed-music step
     would ask for /tools/checks/audio/music/… and 404. -->
<base href="/">
</head><body><script type="module">
// Intercept every connection to ctx.destination so we can tap real output.
const RealAC = window.AudioContext;
let tapped = null;
window.AudioContext = class extends RealAC {
  constructor(...a) {
    super(...a);
    const analyser = this.createAnalyser();
    analyser.fftSize = 2048;
    analyser.connect(super.destination);
    tapped = analyser;
    const dest = super.destination;
    const origConnect = AudioNode.prototype.connect;
    AudioNode.prototype.connect = function (target, ...rest) {
      if (target === dest) return origConnect.call(this, analyser, ...rest);
      return origConnect.call(this, target, ...rest);
    };
  }
};

const { audio } = await import('/src/engine/audio.ts');
const r = (window.__r = { steps: [] });

function level() {
  if (!tapped) return null;
  const buf = new Float32Array(tapped.fftSize);
  tapped.getFloatTimeDomainData(buf);
  let peak = 0, sum = 0;
  for (const v of buf) { const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; }
  return { peak: +peak.toFixed(5), rms: +Math.sqrt(sum / buf.length).toFixed(5) };
}
const wait = (ms) => new Promise((res) => setTimeout(res, ms));

try {
  audio.unlock();
  await wait(300);
  r.ctxCreated = !!tapped;
  r.steps.push(['silence', level()]);

  audio.setAmbience('rain-window');
  await wait(2500);
  r.steps.push(['rain-window', level()]);

  audio.setAmbience('fire-crackle');
  await wait(3500);
  r.steps.push(['fire-crackle', level()]);

  audio.setMusic('main-theme');
  await wait(3000);
  r.steps.push(['music+ambience', level()]);

  audio.setAmbience('silence');
  audio.setMusic(null);
  await wait(3500);
  r.steps.push(['faded-out', level()]);


  const sfxPeaks = [];
  for (const s of ['click-brass', 'page-turn', 'lock-click', 'puzzle-solved', 'thunder']) {
    audio.playSound(s);
    await wait(120);
    let p = 0;
    for (let i = 0; i < 12; i++) { const l = level(); if (l.peak > p) p = l.peak; await wait(40); }
    sfxPeaks.push([s, p]);
    await wait(400);
  }
  r.sfx = sfxPeaks;

  // Composed score. A recorded track reaches the speakers through the music
  // strip rather than straight from its element, which is what keeps the
  // settings fader and — the part that actually matters — voice ducking working
  // over it. If the routing ever breaks, the tap below hears nothing, because
  // the tap is on the graph.
  // Fetched rather than imported: an import assertion for JSON is not supported
  // uniformly across the dev server and the built bundle, and this only needs
  // the data.
  const musicIndex = await (await fetch('/src/game/music-index.json')).json();
  audio.setComposedMusic(musicIndex);
  const composed = [];
  for (const name of ['vaults', 'headland', 'main-theme']) {
    audio.setMusic(name);
    // Long enough to fetch, decode and complete the 4.2s crossfade.
    await wait(7000);
    composed.push([name, level()]);
    audio.setMusic(null);
    await wait(4600);
  }
  r.composed = composed;
  r.composedNames = Object.keys(musicIndex);
  r.ok = true;
} catch (e) {
  r.err = String(e && e.stack ? e.stack : e).slice(0, 500);
}
r.done = true;
</script></body></html>
